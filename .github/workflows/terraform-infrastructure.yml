name: Provision Infrastructure

on:
  workflow_dispatch: # "trigger: none"

permissions:
  contents: read
  security-events: write
  
jobs:
  terraform-job:
    name: Run Terraform Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # DevSecOps: Install Trivy and scan
      - name: DevSecOps Install Trivy
        run: |
          echo "===> Installing Trivy..."
          sudo apt-get install wget apt-transport-https gnupg lsb-release -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y && sudo apt-get install trivy -y

      - name: DevSecOps Trivy IaC Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './terraform'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      #  Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      # Terraform Init
      - name: Terraform Init
        working-directory: 'terraform'
        env:
          ARM_CLIENT_ID: ${{ vars.TF_VAR_AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.TF_VAR_AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform init \
            -backend-config="client_id=${ARM_CLIENT_ID}" \
            -backend-config="client_secret=${ARM_CLIENT_SECRET}" \
            -backend-config="tenant_id=${ARM_TENANT_ID}" \
            -backend-config="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -backend-config="resource_group_name=game-infra-tfstate-rg" \
            -backend-config="storage_account_name=gametfstatestorage2026" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=game-api.terraform.tfstate"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ vars.TF_VAR_AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.TF_VAR_AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      # Terraform Apply
      - name: Terraform Apply
        working-directory: 'terraform'
        env:
          ARM_CLIENT_ID: ${{ vars.TF_VAR_AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.TF_VAR_AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_azure_devops_pat: ${{ secrets.TF_VAR_AZURE_DEVOPS_PAT }}
          TF_VAR_azure_client_object_id: ${{ vars.TF_VAR_AZURE_CLIENT_OBJECT_ID }}
        run: |
          terraform apply -auto-approve \
            -var="azure_client_id=${ARM_CLIENT_ID}" \
            -var="azure_client_secret=${ARM_CLIENT_SECRET}" \
            -var="azure_devops_pat=${TF_VAR_azure_devops_pat}" \
            -var="azure_client_object_id=${TF_VAR_azure_client_object_id}"