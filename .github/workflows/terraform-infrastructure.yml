name: Provision Infrastructure

on:
  workflow_dispatch: # "trigger: none"

jobs:
  terraform-job:
    name: Run Terraform Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # DevSecOps: Install Trivy and scan
      - name: DevSecOps Install Trivy
        run: |
          echo "===> Installing Trivy..."
          sudo apt-get install wget apt-transport-https gnupg lsb-release -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y && sudo apt-get install trivy -y

      - name: Trivy IaC Security Scan
        run: |
          echo "===> Downloading JUnit template & scanning Terraform..."
          curl -sSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/junit.tpl -o junit.tpl

          trivy config ./terraform/01-main-infrastructure \
            --format template \
            --template "@junit.tpl" \
            -o trivy-iac-results.xml \
            --exit-code 0 \
            --skip-version-check \
            --severity HIGH,CRITICAL

      # Publish report on GitHub Actions
      - name: Publish Security IaC Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'trivy-iac-results.xml'
          require_tests: true

      # Authentication on Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      #  Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      # Terraform Init
      - name: Terraform Init
        working-directory: 'terraform/01-main-infrastructure'
        run: |
          terraform init \
            -backend-config="resource_group_name=game-infra-tfstate-rg" \
            -backend-config="storage_account_name=gametfstatestorage2026" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=game-api.terraform.tfstate"

      # Terraform Apply
      - name: Terraform Apply
        working-directory: 'terraform/01-main-infrastructure'
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TF_VAR_azure_devops_pat: ${{ secrets.TF_VAR_AZURE_DEVOPS_PAT }}
          TF_VAR_azure_client_object_id: ${{ secrets.TF_VAR_AZURE_CLIENT_OBJECT_ID }}
        run: |
          terraform apply -auto-approve \
            -var="azure_client_id=${ARM_CLIENT_ID}" \
            -var="azure_client_secret=${ARM_CLIENT_SECRET}" \
            -var="azure_devops_pat=${TF_VAR_azure_devops_pat}" \
            -var="azure_client_object_id=${TF_VAR_azure_client_object_id}"